<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Madeira</title>
<meta name="description" content="Install Madeira on your iPhone or iPad.">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  :root {
    --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73;
    --accent: #0a84ff; --accent-text: #ffffff; --line: #e5e5ea;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --card: #1c1c1e; --text: #f5f5f7; --muted: #98989d; --line: #2c2c2e; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main {
    width: 100%; max-width: 420px; background: var(--card); border-radius: 28px;
    padding: 36px 28px 28px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.08);
  }
  .icon { width: 112px; height: 112px; border-radius: 25px; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
  h1 { font-size: 30px; margin: 18px 0 2px; letter-spacing: -.02em; }
  .version { color: var(--muted); font-size: 15px; margin: 0 0 26px; min-height: 22px; }
  .btn {
    display: block; width: 100%; padding: 16px; border-radius: 14px; border: 0;
    background: var(--accent); color: var(--accent-text); font-size: 18px; font-weight: 600;
    text-decoration: none; transition: transform .1s, opacity .2s;
  }
  .btn:active { transform: scale(.98); }
  .btn.secondary { background: transparent; color: var(--accent); font-weight: 500; font-size: 16px; padding: 12px; margin-top: 6px; }
  .notes { text-align: left; border-top: 1px solid var(--line); margin-top: 22px; padding-top: 18px; color: var(--muted); font-size: 14px; }
  .notes h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; margin: 0 0 8px; color: var(--muted); }
  .notes ol { margin: 0; padding-left: 20px; }
  .notes li { margin: 4px 0; }
  .changes { white-space: pre-wrap; margin: 0 0 16px; color: var(--text); }
  .picker {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin: -10px 0 18px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px;
    font-size: 15px; color: var(--muted); text-align: left;
  }
  .picker select {
    flex: 1; min-width: 0; text-align: right; background: transparent; border: 0;
    color: var(--text); font: inherit; font-weight: 500; appearance: none; -webkit-appearance: none;
    padding-right: 18px; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: right 6px center, right 1px center; background-size: 5px 5px; background-repeat: no-repeat;
  }
  .picker select:focus { outline: none; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <img class="icon" src="icon.png" alt="">
  <h1>Madeira</h1>
  <p class="version" id="version">&nbsp;</p>

  <label class="picker hidden" id="picker-wrap">
    <span>Version</span>
    <select id="picker" aria-label="Release"></select>
  </label>

  <a class="btn" id="install" href="#">Install</a>
  <a class="btn secondary" id="ipa" href="#">Download IPA</a>

  <section class="notes">
    <div id="changes-wrap" class="hidden">
      <h2>What's new</h2>
      <p class="changes" id="changes"></p>
    </div>
    <h2>Installing</h2>
    <ol>
      <li>Open this page in Safari on your iPhone or iPad and tap Install.</li>
      <li>Confirm the prompt, then go to the Home Screen to watch it download.</li>
      <li>Only devices registered for this build can install it.</li>
    </ol>
  </section>
</main>
<script>
  // Works for any owner/repo: <owner>.github.io/<repo>/
  const owner = location.hostname.split(".")[0];
  const repo = location.pathname.split("/").filter(Boolean)[0] || "madeira-download";
  const base = location.origin + "/" + repo + "/";
  const $ = id => document.getElementById(id);
  const install = manifest =>
    "itms-services://?action=download-manifest&url=" + encodeURIComponent(base + manifest);
  const fmtDate = s => new Date(s).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });

  // Until the release list loads (or if the API is unavailable), install the latest.
  $("install").href = install("manifest.plist");
  $("ipa").href = "https://github.com/" + owner + "/" + repo + "/releases/latest/download/Madeira.ipa";

  function show(rel, isLatest) {
    const asset = (rel.assets || []).find(a => a.name === "Madeira.ipa");
    const size = asset ? " · " + Math.round(asset.size / 1048576) + " MB" : "";
    $("version").textContent = (rel.name || rel.tag_name) + " · " + fmtDate(rel.published_at) + size;
    // Each release has its own manifest; manifest.plist always follows the latest.
    $("install").href = install(isLatest ? "manifest.plist" : "manifests/" + rel.tag_name + ".plist");
    $("install").textContent = isLatest ? "Install" : "Install this version";
    if (asset) $("ipa").href = asset.browser_download_url;
    const body = (rel.body || "").trim();
    $("changes").textContent = body;
    $("changes-wrap").classList.toggle("hidden", !body);
  }

  fetch("https://api.github.com/repos/" + owner + "/" + repo + "/releases?per_page=100")
    .then(r => r.ok ? r.json() : [])
    .then(list => {
      const releases = list.filter(r => !r.draft && (r.assets || []).some(a => a.name === "Madeira.ipa"));
      if (!releases.length) return;
      const latest = releases.find(r => !r.prerelease) || releases[0];
      const picker = $("picker");
      releases.forEach(r => {
        const o = document.createElement("option");
        o.value = r.tag_name;
        o.textContent = (r.name || r.tag_name) + " — " + fmtDate(r.published_at) + (r === latest ? " (latest)" : "");
        picker.appendChild(o);
      });
      const fromHash = releases.find(r => "#" + r.tag_name === location.hash);
      const initial = fromHash || latest;
      picker.value = initial.tag_name;
      picker.addEventListener("change", () => {
        const rel = releases.find(r => r.tag_name === picker.value);
        history.replaceState(null, "", rel === latest ? location.pathname : "#" + rel.tag_name);
        show(rel, rel === latest);
      });
      $("picker-wrap").classList.remove("hidden");
      show(initial, initial === latest);
    })
    .catch(() => {});
</script>
</body>
</html>
